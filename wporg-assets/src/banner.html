<!doctype html>
<!-- WordPress.org plugin banner. Rendered by render.mjs at 772x250 (banner-772x250.png) and at 2x (banner-1544x500.png). -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body {
    width: 772px; height: 250px; overflow: hidden; position: relative;
    font-family: Inter, "Segoe UI", system-ui, sans-serif; color: #eef0f6;
    background:
      radial-gradient(520px 320px at 0% 0%, rgba(224, 95, 51, .30), transparent 70%),
      radial-gradient(420px 300px at 100% 100%, rgba(224, 95, 51, .10), transparent 70%),
      #0b0d12;
  }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: #e05f33; }
  .text { position: absolute; left: 44px; top: 34px; width: 500px; }
  .word { font-size: 20px; font-weight: 700; letter-spacing: -.2px; }
  .word b { color: #e8693c; font-weight: 700; }
  .word span { color: #8f96a8; font-weight: 500; margin-left: 8px; }
  h1 { margin: 18px 0 0; font-size: 35px; line-height: 1.12; font-weight: 700; letter-spacing: -.9px; }
  .chips { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 7px; width: 470px; }
  .chips i {
    font-style: normal; font-size: 11.5px; font-weight: 500; color: #c3c8d6;
    padding: 4px 10px; border-radius: 999px; background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .10);
  }
  .mark {
    position: absolute; right: 56px; top: 41px; width: 168px; height: 168px; border-radius: 30px; background: #fff;
    overflow: hidden; box-shadow: 0 18px 50px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .08);
  }
  /* The logo file is 512x512 with the mark in its middle third; enlarge so the mark fills the tile. */
  .mark img { position: absolute; width: 270px; height: 270px; left: -51px; top: -52px; }
</style>
</head>
<body>
  <div class="text">
    <div class="word">zip<b>logger</b><span>for WordPress</span></div>
    <h1>Error monitoring<br>&amp; session replay</h1>
    <div class="chips">
      <i>PHP errors</i><i>JavaScript errors</i><i>Web Vitals</i><i>Tracing</i><i>Session replay</i><i>WooCommerce</i>
    </div>
  </div>
  <div class="mark"><img src="logo-512.png" alt=""></div>
  <div class="bar"></div>
</body>
</html>
