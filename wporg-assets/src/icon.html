<!doctype html>
<!-- WordPress.org plugin icon. Rendered by render.mjs at 128x128 (icon-128x128.png) and at 2x (icon-256x256.png). -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body { width: 128px; height: 128px; overflow: hidden; position: relative; background: #fff; }
  /* The logo file is 512x512 with the mark in its middle third; enlarge so the mark fills the icon. */
  img { position: absolute; width: 212px; height: 212px; left: -42px; top: -43px; }
</style>
</head>
<body><img src="logo-512.png" alt=""></body>
</html>
